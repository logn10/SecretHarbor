name: SecretHarbor CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile Binaries
        run: |
          make build
          make man

      - name: Run Test Suite
        run: |
          go test -v -race ./...

      - name: Verify Documentation & Man Pages Up-to-Date
        run: |
          if [ -d ".git" ]; then
            git diff --exit-code man/man1 || (echo "Man pages out of date. Run 'make man' and commit." && exit 1)
          fi

      - name: Run Adversarial Security Doctor Suite
        run: |
          ./bin/shb doctor
